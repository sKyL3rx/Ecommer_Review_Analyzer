apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker
  namespace: ecommerce-review

spec:
  replicas: 1
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      nodeSelector:
        workload: cpu

      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432 && nc -z redis 6379; do
                echo "Waiting for postgres and redis..."
                sleep 2
              done

      containers:
        - name: worker
          image: ecommerce-review-analyzer
          imagePullPolicy: IfNotPresent

          command:
            - rq

          args:
            - worker
            - insights
            - --url
            - redis://redis:6379/0

          envFrom:
            - configMapRef:
                name: ecommerce-review-config

            - secretRef:
                name: ecommerce-review-env

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
