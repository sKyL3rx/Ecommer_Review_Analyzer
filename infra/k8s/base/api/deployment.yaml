apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ecommerce-review

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      nodeSelector:
        workload: cpu

      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432 && nc -z redis 6379; do
                echo "Waiting for postgres and redis..."
                sleep 2
              done

      containers:
        - name: api
          image: ecommerce-review-analyzer
          imagePullPolicy: IfNotPresent

          command:
            - uvicorn

          args:
            - src.app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"

          envFrom:
            - configMapRef:
                name: ecommerce-review-config

            - secretRef:
                name: ecommerce-review-env

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
