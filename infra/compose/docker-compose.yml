services:
  api:
    build: 
      context: ../..
      dockerfile: Dockerfile
    container_name: ecom-api
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      PYTHONPATH: /app
    volumes:
      - ../..:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: ecom-worker
    command: rq worker insights --url redis://redis:6379/0
    env_file:
      - ../../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    volumes:
      - ../..:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  
  redis:
    image: redis:7
    container_name: ecom-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  
volumes:
  redis_data: