name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      USE_FAKE_SUMMARIZER: "true"
      USE_FAKE_SENTIMENT: "true"
      AUTO_CREATE_TABLES: "false"
      SUMMARY_MODEL_VERSION: "summary-sft"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-serving.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-serving.txt
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run lint
        run: |
          ruff check src scripts tests

      - name: Run unit tests
        run: |
          pytest tests/unit -q

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecom_review
          POSTGRES_USER: ecom
          POSTGRES_PASSWORD: ecom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecom -d ecom_review"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg://ecom:ecom@localhost:5432/ecom_review
      REDIS_URL: redis://localhost:6379/0
      VLLM_BASE_URL: http://localhost:8001/v1
      VLLM_API_KEY: demo-key
      SUMMARY_MODEL_NAME: summary-sft
      SUMMARY_MODEL_VERSION: summary-sft
      USE_FAKE_SUMMARIZER: "true"
      USE_FAKE_SENTIMENT: "true"
      AUTO_CREATE_TABLES: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-serving.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-serving.txt
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Run integration tests
        run: |
          pytest tests/integration -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: integration
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --tag ecommerce-review-analyzer:ci .